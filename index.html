<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Court Call — Tennis Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10151b;
    --surface: #171e26;
    --line: #2a333d;
    --ball: #d9f04b;
    --ball-dim: #a7b93a;
    --ink: #f5f7f2;
    --muted: #7c8a97;
    --danger: #e2604f;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: radial-gradient(ellipse at 50% -10%, #1a222b 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    overflow-y: auto;
    height:100vh;
    display:flex;
    flex-direction:column;
    user-select:none;
  }

  header{
    position:relative; z-index:1;
    display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px 6px;
  }
  .status{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.04em;
    color: var(--muted);
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--muted); transition:background .2s; }
  .dot.on{ background: var(--ball); box-shadow: 0 0 8px var(--ball); }

  .header-right{ display:flex; align-items:center; gap:4px; }
  .iconbtn{
    background:none; border:none; color:var(--muted); padding:8px;
    cursor:pointer; font-size:16px; -webkit-tap-highlight-color: transparent;
  }
  .iconbtn:active{ color: var(--ink); }

  .scoreboard{
    position:relative; z-index:1;
    margin: 4px 16px 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .sb-row{
    display:flex; align-items:center; gap:8px;
    padding: 7px 10px;
  }
  .sb-row + .sb-row{ border-top: 1px solid var(--line); }
  .sb-serve{
    width:12px; flex-shrink:0; text-align:center;
    color: var(--ball); font-size:10px; opacity:0;
    animation: servePulseText 2s ease-in-out infinite;
  }
  .sb-serve.active{ opacity:1; }
  @keyframes servePulseText{
    0%,100%{ opacity:1; } 50%{ opacity:0.35; }
  }
  .sb-name-input{
    flex:1; min-width:0;
    background:none; border:none; color: var(--ink);
    font-family:'Inter'; font-weight:600; font-size:13px;
    padding:0;
  }
  .sb-sets{ display:flex; gap:5px; flex-shrink:0; }
  .sb-sets .setcol{
    min-width:22px; text-align:center;
    font-family:'JetBrains Mono', monospace; font-size:13px;
    color: var(--muted);
    padding: 2px 4px; border-radius:5px;
  }
  .sb-sets .setcol.current{
    color: #10151b; background: var(--ball); font-weight:700;
  }

  main{
    position:relative; z-index:1;
    flex:1;
    min-height:0;
    display:grid; grid-template-columns: 1fr auto 1fr;
    align-items:center;
    padding: 0 4px;
  }
  .score-zone{
    height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer;
    position:relative;
  }
  .score-zone:active{ background: rgba(217,240,75,0.04); }
  .score-num{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size: min(30vw, 38vh, 190px);
    line-height:0.85;
    letter-spacing: 0.01em;
    color: var(--ink);
    -webkit-text-stroke: 1.5px var(--ink);
    transition: transform .12s ease, color .12s ease;
  }
  .score-zone.pulse .score-num{ transform: scale(1.06); color: var(--ball); -webkit-text-stroke-color: var(--ball); }
  .tb-label{
    font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--muted);
    letter-spacing:0.1em; margin-top:4px;
  }

  .divider{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding: 0 6px;
    height:60%;
  }
  .divider-line{ flex:1; width:1px; background: var(--line); }
  .ball-icon{ width:18px; height:18px; flex-shrink:0; opacity:0.9; }

  .controls-row{
    position:relative; z-index:1;
    display:flex;
    justify-content:center;
    padding: 6px 0 10px;
  }
  .undo-btn{
    background: var(--surface); border:1px solid var(--line); color: var(--muted);
    font-family:'JetBrains Mono', monospace; font-size:11px;
    padding: 8px 14px; border-radius:20px;
    display:flex; align-items:center; gap:6px;
  }
  .undo-btn:active{ color: var(--ink); border-color: var(--muted); }

  .footer{
    position:relative; z-index:1;
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 18px max(18px, env(safe-area-inset-bottom));
    font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--muted);
    flex-wrap: wrap;
    gap: 10px;
  }
  .tts-toggle{ display:flex; align-items:center; gap:8px; }
  .switch{
    width:34px; height:19px; border-radius:10px; background: var(--surface);
    border:1px solid var(--line); position:relative; cursor:pointer;
  }
  .switch .knob{
    position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%;
    background: var(--muted); transition: all .15s ease;
  }
  .switch.on{ border-color: var(--ball-dim); }
  .switch.on .knob{ left:17px; background: var(--ball); }

  .reset-hold{
    position:relative; overflow:hidden;
    background:none; border:1px solid var(--line); color: var(--danger);
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.05em;
    padding:6px 10px; border-radius:14px;
  }
  .reset-hold .fill{
    position:absolute; left:0; top:0; bottom:0; width:0%; background: rgba(226,96,79,0.25);
    transition: width linear;
  }
  .reset-hold span{ position:relative; }

  .toast{
    position:fixed; left:50%; bottom:70px; transform:translateX(-50%);
    background: var(--surface); border:1px solid var(--line); color: var(--ink);
    padding:8px 16px; border-radius:20px; font-size:12px;
    opacity:0; pointer-events:none; transition: opacity .25s ease;
    z-index: 20; white-space:nowrap; max-width: 88vw; text-align:center;
  }
  .toast.show{ opacity:1; }

  @media (orientation: landscape) and (max-height: 500px){
    header{ padding: max(6px, env(safe-area-inset-top)) 16px 2px; }
    .scoreboard{ margin: 2px 16px 0; }
    .sb-row{ padding: 4px 10px; }
    .sb-name-input{ font-size:11px; }
    .sb-sets .setcol{ font-size:11px; min-width:18px; }
    .controls-row{ padding: 2px 24px 4px; }
    .footer{ padding: 0 18px max(8px, env(safe-area-inset-bottom)); font-size:10px; }
    .undo-btn{ padding:5px 12px; font-size:10px; }
  }

  /* Settings panel */
  .overlay{
    position:fixed; inset:0; background: rgba(0,0,0,0.55);
    display:none; align-items:flex-end; justify-content:center; z-index:30;
  }
  .overlay.show{ display:flex; }
  .sheet{
    background: var(--surface); border-top:1px solid var(--line);
    border-radius: 18px 18px 0 0;
    width:100%; max-width:480px; padding: 20px 20px max(20px, env(safe-area-inset-bottom));
    font-family:'Inter', sans-serif;
  }
  .sheet h3{ margin:0 0 16px; font-size:15px; letter-spacing:0.02em; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; color: var(--muted); margin-bottom:8px; font-family:'JetBrains Mono', monospace; letter-spacing:0.05em; }
  .seg{ display:flex; gap:8px; }
  .seg button{
    flex:1; background: var(--bg); border:1px solid var(--line); color: var(--muted);
    padding:9px 6px; border-radius:10px; font-size:13px; font-family:'Inter';
  }
  .seg button.active{ border-color: var(--ball-dim); color: var(--ball); background: rgba(217,240,75,0.06); }
  .num-input{
    width:100%; background: var(--bg); border:1px solid var(--line); color: var(--ink);
    padding:9px 12px; border-radius:10px; font-size:14px; font-family:'JetBrains Mono', monospace;
  }
  .row-between{ display:flex; align-items:center; justify-content:space-between; }
  .sheet-close{
    width:100%; margin-top:6px; background: var(--ball); color:#10151b; border:none;
    padding:12px; border-radius:12px; font-weight:700; font-size:14px;
  }
</style>
</head>
<body>

  <header>
    <div class="status">
      <span class="dot" id="bleDot"></span>
      <span id="bleLabel">CLICKER OFF</span>
    </div>
    <div class="header-right">
      <button class="iconbtn" id="settingsBtn" title="Match settings">⚙</button>
      <button class="iconbtn" id="helpBtn" title="How to use">?</button>
    </div>
  </header>

  <div class="scoreboard">
    <div class="sb-row">
      <span class="sb-serve" id="serve1">●</span>
      <input class="sb-name-input" id="p1Name" value="Player 1" maxlength="14">
      <div class="sb-sets" id="sbSets1"></div>
    </div>
    <div class="sb-row">
      <span class="sb-serve" id="serve2">●</span>
      <input class="sb-name-input" id="p2Name" value="Player 2" maxlength="14">
      <div class="sb-sets" id="sbSets2"></div>
    </div>
  </div>

  <main>
    <div class="score-zone" id="zone1">
      <div class="score-num" id="score1">0</div>
      <div class="tb-label" id="tbLabel1"></div>
    </div>
    <div class="divider">
      <div class="divider-line"></div>
      <svg class="ball-icon" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="#d9f04b" opacity="0.85"/>
        <path d="M12 3 C5 8, 19 16, 12 21" stroke="#10151b" stroke-width="1.3" fill="none"/>
      </svg>
      <div class="divider-line"></div>
    </div>
    <div class="score-zone" id="zone2">
      <div class="score-num" id="score2">0</div>
      <div class="tb-label" id="tbLabel2"></div>
    </div>
  </main>

  <div class="controls-row">
    <button class="undo-btn" id="undo1">↺ UNDO</button>
  </div>

  <div class="footer">
    <div class="tts-toggle">
      <div class="switch" id="ttsSwitch"><div class="knob"></div></div>
      <span>VOICE</span>
    </div>
    <button class="reset-hold" id="resetBtn"><div class="fill" id="resetFill"></div><span>HOLD TO RESET MATCH</span></button>
  </div>

  <div class="toast" id="toast"></div>

  <video id="noSleepVideo" muted loop playsinline webkit-playsinline
    style="position:fixed; top:0; left:0; width:1px; height:1px; opacity:0.01; pointer-events:none; z-index:-1;">
    <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAMXbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAA+gAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAkF0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAA+gAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAIAAAACAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAPoAAAAAAABAAAAAAG5bWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAABAAAAAQABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABZG1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAASRzdGJsAAAAwHN0c2QAAAAAAAAAAQAAALBhdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAIAAgBIAAAASAAAAAAAAAABFUxhdmM2MC4zMS4xMDIgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAANmF2Y0MBZAAK/+EAGWdkAAqs2V+IiMBEAAADAAQAAAMACDxIllgBAAZo6+PLIsD9+PgAAAAAEHBhc3AAAAABAAAAAQAAABRidHJ0AAAAAAAAFigAABYoAAAAGHN0dHMAAAAAAAAAAQAAAAEAAEAAAAAAHHN0c2MAAAAAAAAAAQAAAAEAAAABAAAAAQAAABRzdHN6AAAAAAAAAsUAAAABAAAAFHN0Y28AAAAAAAAAAQAAA0cAAABidWR0YQAAAFptZXRhAAAAAAAAACFoZGxyAAAAAAAAAABtZGlyYXBwbAAAAAAAAAAAAAAAAC1pbHN0AAAAJal0b28AAAAdZGF0YQAAAAEAAAAATGF2ZjYwLjE2LjEwMAAAAAhmcmVlAAACzW1kYXQAAAKtBgX//6ncRem95tlIt5Ys2CDZI+7veDI2NCAtIGNvcmUgMTY0IHIzMTA4IDMxZTE5ZjkgLSBILjI2NC9NUEVHLTQgQVZDIGNvZGVjIC0gQ29weWxlZnQgMjAwMy0yMDIzIC0gaHR0cDovL3d3dy52aWRlb2xhbi5vcmcveDI2NC5odG1sIC0gb3B0aW9uczogY2FiYWM9MSByZWY9MyBkZWJsb2NrPTE6MDowIGFuYWx5c2U9MHgzOjB4MTEzIG1lPWhleCBzdWJtZT03IHBzeT0xIHBzeV9yZD0xLjAwOjAuMDAgbWl4ZWRfcmVmPTEgbWVfcmFuZ2U9MTYgY2hyb21hX21lPTEgdHJlbGxpcz0xIDh4OGRjdD0xIGNxbT0wIGRlYWR6b25lPTIxLDExIGZhc3RfcHNraXA9MSBjaHJvbWFfcXBfb2Zmc2V0PS0yIHRocmVhZHM9MSBsb29rYWhlYWRfdGhyZWFkcz0xIHNsaWNlZF90aHJlYWRzPTAgbnI9MCBkZWNpbWF0ZT0xIGludGVybGFjZWQ9MCBibHVyYXlfY29tcGF0PTAgY29uc3RyYWluZWRfaW50cmE9MCBiZnJhbWVzPTMgYl9weXJhbWlkPTIgYl9hZGFwdD0xIGJfYmlhcz0wIGRpcmVjdD0xIHdlaWdodGI9MSBvcGVuX2dvcD0wIHdlaWdodHA9MiBrZXlpbnQ9MjUwIGtleWludF9taW49MSBzY2VuZWN1dD00MCBpbnRyYV9yZWZyZXNoPTAgcmNfbG9va2FoZWFkPTQwIHJjPWNyZiBtYnRyZWU9MSBjcmY9MjMuMCBxY29tc   </video>

  <div class="overlay" id="settingsOverlay">
    <div class="sheet">
      <h3>MATCH SETTINGS</h3>

      <div class="field">
        <label>MATCH FORMAT</label>
        <div class="seg" id="formatSeg">
          <button data-sets="1">1 Set</button>
          <button data-sets="2">Best of 3</button>
          <button data-sets="3">Best of 5</button>
        </div>
      </div>

      <div class="field">
        <label>GAMES PER SET (first to)</label>
        <input class="num-input" id="gamesPerSetInput" type="number" min="2" max="12" value="6">
      </div>

      <div class="field row-between">
        <label style="margin:0;">TIEBREAK AT 6-6 (or set target-target)</label>
        <div class="switch" id="tbSwitch"><div class="knob"></div></div>
      </div>

      <div class="field">
        <label>SERVING FIRST</label>
        <div class="seg" id="serverSeg">
          <button data-server="1">Player 1</button>
          <button data-server="2">Player 2</button>
        </div>
      </div>

      <div class="field">
        <label>CALLER VOICE</label>
        <select class="num-input" id="voiceSelect"></select>
      </div>

      <button class="sheet-close" id="settingsClose">DONE</button>
    </div>
  </div>

<script>
(function(){
  const POINT_LABELS = ['Love','15','30','40'];

  const config = {
    setsToWin: 2,        // 1 = single set, 2 = best of 3, 3 = best of 5
    gamesPerSet: 6,
    tiebreakEnabled: true
  };

  const state = {
    p1: 0, p2: 0,
    games1: 0, games2: 0,
    sets1: 0, sets2: 0,
    setHistory: [], // completed sets: [{g1,g2}, ...]
    server: 1,
    ttsOn: false,
    selectedVoiceURI: null,
    history: [],
    tiebreak: false,
    tb1: 0, tb2: 0,
    matchOver: false
  };

  const el = {
    score1: document.getElementById('score1'),
    score2: document.getElementById('score2'),
    tbLabel1: document.getElementById('tbLabel1'),
    tbLabel2: document.getElementById('tbLabel2'),
    zone1: document.getElementById('zone1'),
    zone2: document.getElementById('zone2'),
    sbSets1: document.getElementById('sbSets1'),
    sbSets2: document.getElementById('sbSets2'),
    serve1: document.getElementById('serve1'),
    serve2: document.getElementById('serve2'),
    p1Name: document.getElementById('p1Name'),
    p2Name: document.getElementById('p2Name'),
    undo1: document.getElementById('undo1'),
    ttsSwitch: document.getElementById('ttsSwitch'),
    resetBtn: document.getElementById('resetBtn'),
    resetFill: document.getElementById('resetFill'),
    toast: document.getElementById('toast'),
    bleDot: document.getElementById('bleDot'),
    bleLabel: document.getElementById('bleLabel'),
    helpBtn: document.getElementById('helpBtn'),
    settingsBtn: document.getElementById('settingsBtn'),
    settingsOverlay: document.getElementById('settingsOverlay'),
    settingsClose: document.getElementById('settingsClose'),
    formatSeg: document.getElementById('formatSeg'),
    gamesPerSetInput: document.getElementById('gamesPerSetInput'),
    tbSwitch: document.getElementById('tbSwitch'),
    serverSeg: document.getElementById('serverSeg'),
    voiceSelect: document.getElementById('voiceSelect')
  };

  function pushHistory(){
    state.history.push(JSON.stringify({
      p1:state.p1, p2:state.p2, games1:state.games1, games2:state.games2,
      sets1:state.sets1, sets2:state.sets2, tiebreak:state.tiebreak,
      tb1:state.tb1, tb2:state.tb2, matchOver:state.matchOver,
      setHistory: state.setHistory
    }));
    if(state.history.length > 80) state.history.shift();
  }

  function showToast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> el.toast.classList.remove('show'), 1800);
  }

  function speak(text){
    if(!state.ttsOn) return;
    if(!('speechSynthesis' in window)){
      showToast('Speech synthesis not supported on this device');
      return;
    }
    const doSpeak = () => {
      window.speechSynthesis.cancel();
      const voices = window.speechSynthesis.getVoices();
      let chosen = null;
      if(state.selectedVoiceURI){
        chosen = voices.find(v => v.voiceURI === state.selectedVoiceURI) || null;
      }
      if(!chosen){
        chosen = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) || null;
      }
      const u = new SpeechSynthesisUtterance(text);
      if(chosen){ u.voice = chosen; u.lang = chosen.lang; }
      else { u.lang = 'en-US'; }
      u.rate = 1.0;
      u.onerror = (ev) => showToast('Voice error: ' + (ev.error || 'unknown'));
      window.speechSynthesis.speak(u);
    };
    const voices = window.speechSynthesis.getVoices();
    if(voices && voices.length){ doSpeak(); }
    else {
      window.speechSynthesis.onvoiceschanged = doSpeak;
      setTimeout(doSpeak, 300);
    }
  }

  function populateVoiceList(){
    if(!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
    if(!voices.length) return;
    const prev = state.selectedVoiceURI;
    el.voiceSelect.innerHTML = '';
    const autoOpt = document.createElement('option');
    autoOpt.value = '';
    autoOpt.textContent = 'Auto (default English voice)';
    el.voiceSelect.appendChild(autoOpt);
    voices.forEach(v=>{
      const opt = document.createElement('option');
      opt.value = v.voiceURI;
      opt.textContent = v.name + ' (' + v.lang + ')';
      el.voiceSelect.appendChild(opt);
    });
    el.voiceSelect.value = prev || '';
  }
  if('speechSynthesis' in window){
    populateVoiceList();
    window.speechSynthesis.onvoiceschanged = populateVoiceList;
  }

  function scoreDisplay(mine, theirs){
    if(mine < 3 || theirs < 3) return POINT_LABELS[Math.min(mine,3)];
    if(mine - theirs === 1) return 'Ad';
    if(theirs - mine === 1) return '40';
    return POINT_LABELS[Math.min(mine,3)];
  }

  function render(){
    if(state.tiebreak){
      el.score1.textContent = state.tb1;
      el.score2.textContent = state.tb2;
      el.tbLabel1.textContent = 'TIEBREAK';
      el.tbLabel2.textContent = 'TIEBREAK';
    } else {
      const p1 = state.p1, p2 = state.p2;
      if(p1>=3 && p2>=3 && p1===p2){
        el.score1.textContent = 'Deuce';
        el.score2.textContent = 'Deuce';
      } else {
        el.score1.textContent = scoreDisplay(p1, p2);
        el.score2.textContent = scoreDisplay(p2, p1);
      }
      el.tbLabel1.textContent = '';
      el.tbLabel2.textContent = '';
    }

    renderSetTable();
    el.serve1.classList.toggle('active', state.server === 1);
    el.serve2.classList.toggle('active', state.server === 2);
  }

  function renderSetTable(){
    // Number of set columns to show: completed sets + the current in-progress one.
    const maxSets = config.setsToWin * 2 - 1;
    const completed = state.setHistory.length;
    const colCount = Math.min(maxSets, Math.max(completed + 1, 1));

    function buildCols(container, isPlayer1){
      container.innerHTML = '';
      for(let i = 0; i < colCount; i++){
        const span = document.createElement('span');
        span.className = 'setcol';
        if(i < completed){
          const s = state.setHistory[i];
          span.textContent = isPlayer1 ? s.g1 : s.g2;
        } else if(i === completed){
          span.textContent = isPlayer1 ? state.games1 : state.games2;
          span.classList.add('current');
        }
        container.appendChild(span);
      }
    }
    buildCols(el.sbSets1, true);
    buildCols(el.sbSets2, false);
  }
  function pulse(zoneEl){
    zoneEl.classList.add('pulse');
    setTimeout(()=> zoneEl.classList.remove('pulse'), 140);
  }

  function names(){
    return [el.p1Name.value || 'Player 1', el.p2Name.value || 'Player 2'];
  }

  function callOutPoint(){
    const [n1, n2] = names();
    if(state.tiebreak){
      const serverScore = state.server===1 ? state.tb1 : state.tb2;
      const receiverScore = state.server===1 ? state.tb2 : state.tb1;
      if(serverScore === receiverScore){ speak(serverScore + ' All'); return; }
      speak(serverScore + ', ' + receiverScore);
      return;
    }
    const p1 = state.p1, p2 = state.p2;
    if(p1>=3 && p2>=3){
      if(p1===p2){ speak('Deuce'); return; }
      if(p1-p2===1){ speak('Advantage ' + n1); return; }
      if(p2-p1===1){ speak('Advantage ' + n2); return; }
    }
    if(p1 === p2){ speak(POINT_LABELS[Math.min(p1,3)] + ' All'); return; }
    const serverPts = state.server===1 ? p1 : p2;
    const receiverPts = state.server===1 ? p2 : p1;
    speak(POINT_LABELS[Math.min(serverPts,3)] + ', ' + POINT_LABELS[Math.min(receiverPts,3)]);
  }

  function startTiebreak(){
    state.tiebreak = true;
    state.tb1 = 0; state.tb2 = 0;
    showToast('Tiebreak!');
    speak('Tiebreak');
  }

  function finishSet(winner){
    state.setHistory.push({g1: state.games1, g2: state.games2});
    if(winner===1) state.sets1++; else state.sets2++;
    state.p1 = 0; state.p2 = 0;
    state.games1 = 0; state.games2 = 0;
    state.tiebreak = false; state.tb1 = 0; state.tb2 = 0;
    state.server = state.server === 1 ? 2 : 1;

    const [n1, n2] = names();
    const winnerName = winner===1 ? n1 : n2;
    const winnerSets = winner===1 ? state.sets1 : state.sets2;

    if(winnerSets >= config.setsToWin){
      state.matchOver = true;
      showToast(winnerName + ' wins the match!');
      speak('Game, Set, Match, ' + winnerName);
    } else {
      showToast(winnerName + ' wins the set');
      speak('Set, ' + winnerName);
    }
  }

  function finishGame(winner){
    if(winner===1) state.games1++; else state.games2++;
    state.p1 = 0; state.p2 = 0;

    const g1 = state.games1, g2 = state.games2;
    const target = config.gamesPerSet;

    const setWon = (g1>=target || g2>=target) && Math.abs(g1-g2) >= 2;
    if(setWon){
      finishSet(g1 > g2 ? 1 : 2); // finishSet toggles server once
      return;
    }

    if(config.tiebreakEnabled && g1===target && g2===target){
      state.server = state.server === 1 ? 2 : 1; // first serve of the breaker
      startTiebreak();
      return;
    }

    state.server = state.server === 1 ? 2 : 1;
    const [n1, n2] = names();
    speak('Game, ' + (winner===1 ? n1 : n2));
    showToast((winner===1 ? n1 : n2) + ' wins the game');
  }

  function addPoint(player){
    if(state.matchOver) return;
    pushHistory();

    if(state.tiebreak){
      if(player === 1) state.tb1++; else state.tb2++;
      const t1 = state.tb1, t2 = state.tb2;
      const tbWon = (t1>=7 || t2>=7) && Math.abs(t1-t2) >= 2;
      render();
      pulse(player===1? el.zone1: el.zone2);
      if(tbWon){
        const winner = t1 > t2 ? 1 : 2;
        state.games1 = (winner===1) ? config.gamesPerSet + 1 : config.gamesPerSet;
        state.games2 = (winner===2) ? config.gamesPerSet + 1 : config.gamesPerSet;
        finishSet(winner);
        render();
      } else {
        callOutPoint();
      }
      return;
    }

    if(player === 1) state.p1++; else state.p2++;
    const p1 = state.p1, p2 = state.p2;
    const gameWon = (p1>=4 || p2>=4) && Math.abs(p1-p2) >= 2;

    render();
    pulse(player===1? el.zone1: el.zone2);

    if(gameWon){
      finishGame(p1 > p2 ? 1 : 2);
      render();
    } else {
      callOutPoint();
    }
  }

  function undo(){
    if(state.history.length === 0) return;
    const prev = JSON.parse(state.history.pop());
    Object.assign(state, prev);
    render();
    showToast('Point undone');
  }

  el.zone1.addEventListener('click', ()=> addPoint(1));
  el.zone2.addEventListener('click', ()=> addPoint(2));
  el.undo1.addEventListener('click', (e)=>{ e.stopPropagation(); undo(); });
  el.serve1.addEventListener('click', (e)=>{ e.stopPropagation(); state.server=1; render(); });
  el.serve2.addEventListener('click', (e)=>{ e.stopPropagation(); state.server=2; render(); });

  el.ttsSwitch.addEventListener('click', ()=>{
    state.ttsOn = !state.ttsOn;
    el.ttsSwitch.classList.toggle('on', state.ttsOn);
    if(state.ttsOn) speak('Voice on');
  });

  // Settings sheet
  function refreshSettingsUI(){
    [...el.formatSeg.children].forEach(btn=>{
      btn.classList.toggle('active', Number(btn.dataset.sets) === config.setsToWin);
    });
    el.gamesPerSetInput.value = config.gamesPerSet;
    el.tbSwitch.classList.toggle('on', config.tiebreakEnabled);
    [...el.serverSeg.children].forEach(btn=>{
      btn.classList.toggle('active', Number(btn.dataset.server) === state.server);
    });
    el.voiceSelect.value = state.selectedVoiceURI || '';
  }
  el.settingsBtn.addEventListener('click', ()=>{
    refreshSettingsUI();
    el.settingsOverlay.classList.add('show');
  });
  el.settingsClose.addEventListener('click', ()=>{
    el.settingsOverlay.classList.remove('show');
  });
  el.settingsOverlay.addEventListener('click', (e)=>{
    if(e.target === el.settingsOverlay) el.settingsOverlay.classList.remove('show');
  });
  [...el.formatSeg.children].forEach(btn=>{
    btn.addEventListener('click', ()=>{
      config.setsToWin = Number(btn.dataset.sets);
      refreshSettingsUI();
    });
  });
  el.gamesPerSetInput.addEventListener('change', ()=>{
    let v = parseInt(el.gamesPerSetInput.value, 10);
    if(isNaN(v) || v < 2) v = 6;
    if(v > 12) v = 12;
    config.gamesPerSet = v;
    el.gamesPerSetInput.value = v;
  });
  el.tbSwitch.addEventListener('click', ()=>{
    config.tiebreakEnabled = !config.tiebreakEnabled;
    el.tbSwitch.classList.toggle('on', config.tiebreakEnabled);
  });
  [...el.serverSeg.children].forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.server = Number(btn.dataset.server);
      refreshSettingsUI();
      render();
    });
  });
  el.voiceSelect.addEventListener('change', ()=>{
    state.selectedVoiceURI = el.voiceSelect.value || null;
    speak('Voice selected');
  });

  // hold-to-reset
  let holdTimer = null;
  const HOLD_MS = 1200;
  function startHold(){
    el.resetFill.style.transition = 'none';
    el.resetFill.style.width = '0%';
    requestAnimationFrame(()=>{
      el.resetFill.style.transition = 'width ' + HOLD_MS + 'ms linear';
      el.resetFill.style.width = '100%';
    });
    holdTimer = setTimeout(()=>{
      state.p1=0; state.p2=0; state.games1=0; state.games2=0;
      state.sets1=0; state.sets2=0; state.history=[]; state.setHistory=[];
      state.tiebreak=false; state.tb1=0; state.tb2=0; state.matchOver=false;
      render();
      showToast('Match reset');
      endHold();
    }, HOLD_MS);
  }
  function endHold(){
    clearTimeout(holdTimer);
    el.resetFill.style.transition = 'width 120ms ease';
    el.resetFill.style.width = '0%';
  }
  el.resetBtn.addEventListener('mousedown', startHold);
  el.resetBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); startHold(); }, {passive:false});
  el.resetBtn.addEventListener('mouseup', endHold);
  el.resetBtn.addEventListener('mouseleave', endHold);
  el.resetBtn.addEventListener('touchend', endHold);

  // BLE clicker input: physical button sends Spacebar via BLE HID keyboard.
  // 1 press = point for Player 1, 2 presses within DOUBLE_PRESS_MS = point for Player 2.
  const DOUBLE_PRESS_MS = 1000;
  let bleSeen = false;
  let pendingSingleTimer = null;
  let pressCount = 0;

  function markBleOk(){
    if(!bleSeen){
      bleSeen = true;
      el.bleDot.classList.add('on');
      el.bleLabel.textContent = 'CLICKER OK';
    }
  }

  document.addEventListener('keydown', (e)=>{
    if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
    if(e.code !== 'Space' && e.key !== ' ') return;
    e.preventDefault();
    markBleOk();

    pressCount++;
    if(pressCount === 1){
      pendingSingleTimer = setTimeout(()=>{
        addPoint(1);
        pressCount = 0;
      }, DOUBLE_PRESS_MS);
    } else if(pressCount >= 2){
      clearTimeout(pendingSingleTimer);
      addPoint(2);
      pressCount = 0;
    }
  });

  el.helpBtn.addEventListener('click', ()=>{
    showToast('Button = your point / Tap right side = opponent point');
  });

  // Screen Wake Lock: keep the screen on while this app is in front.
  // Note: this only prevents the screen from sleeping while the app is open;
  // it cannot wake an already-locked/sleeping phone from a BLE button press.
  // Falls back to a silent looping video (a common workaround) if the
  // Wake Lock API is unavailable, e.g. when the page is opened as a local
  // file instead of over https.
  let wakeLock = null;
  let wakeLockTried = false;
  const noSleepVideo = document.getElementById('noSleepVideo');

  function startVideoFallback(){
    noSleepVideo.play().catch(()=>{});
  }

  async function requestWakeLock(){
    if(!('wakeLock' in navigator)){
      startVideoFallback();
      if(!wakeLockTried){ wakeLockTried = true; showToast('Using fallback to keep screen on'); }
      return;
    }
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      if(!wakeLockTried){ wakeLockTried = true; showToast('Screen will stay on while app is open'); }
      wakeLock.addEventListener('release', ()=>{
        // Re-acquire if the tab is still visible (lock can be released by the OS)
        if(document.visibilityState === 'visible') requestWakeLock();
      });
    }catch(e){
      startVideoFallback();
      if(!wakeLockTried){ wakeLockTried = true; showToast('Using fallback to keep screen on'); }
    }
  }
  requestWakeLock();
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible'){
      requestWakeLock();
      startVideoFallback();
    }
  });
  document.addEventListener('pointerdown', ()=>{ requestWakeLock(); startVideoFallback(); }, {once:true});

  // iOS Safari requires speechSynthesis to be unlocked by a direct user
  // gesture before later (e.g. setTimeout-triggered) speech will play.
  let audioUnlocked = false;
  function unlockAudioOnce(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    if('speechSynthesis' in window){
      try{
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        window.speechSynthesis.speak(u);
      }catch(e){}
    }
  }
  document.addEventListener('pointerdown', unlockAudioOnce, {once:true});
  document.addEventListener('keydown', unlockAudioOnce, {once:true});

  refreshSettingsUI();
  render();
})();
</script>
</body>
</html>
